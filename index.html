<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de API REST - JSONPlaceholder</title>

    <script>
        // 1. Faz a requisição à API usando o método fetch()
        fetch('https://jsonplaceholder.typicode.com/posts')
          .then(X => X.json()) 
            .then(santos => {
             santos.forEach(post =>{
              console.log('ID: ' + post.id);
              console.log('TITLE: ' + post.title);
              console.log('BODY: ' + post.body);
              console.log('-----------------------------------');
            });
          })
          .catch(erro => {
            // 4. Implementa o tratamento de erros utilizando catch()[cite: 1, 2]
            console.log('Ocorreu um erro: ' + erro);
          });
    </script>
</body>
</html>
